#!/usr/sbin/nft -f
# =============================================================================
# fw01 - Step 2: full filtering policy of the P03 lab
# ANSSI (network filtering): default policy drop, flows explicitly allowed,
# rejects logged.
# =============================================================================
flush ruleset

define WAN       = "ens32"          # VMnet8
define DMZ       = "ens34"          # VMnet11
define SRV       = "ens35"          # VMnet12
define ADMIN     = "ens36"          # VMnet13
define USERS     = "ens37"          # VMnet14
define WAN_IP    = 192.168.93.10
define VMW_DNS   = 192.168.93.2     # VMware DNS proxy (the host VPN blocks direct DNS)
define WEB01     = 10.0.10.10
define AD01      = 10.0.20.10
define NET_ADMIN = 10.0.30.0/24
define NET_USERS = 10.0.40.0/24

table inet filter {
  # Traffic to fw01 itself
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    # Admin SSH: Admin zone only
    iifname $ADMIN ip saddr $NET_ADMIN tcp dport 22 accept
    # Gateway ping from internal zones (diagnostic), rate limited
    iifname { $DMZ, $SRV, $ADMIN, $USERS } icmp type echo-request limit rate 5/second accept
    limit rate 10/minute log prefix "fw01-in-drop " level warn
  }

  # Traffic crossing fw01 (between zones)
  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop

    # --- DMZ -----------------------------------------------------------------
    # web01 -> Internet: DNS, NTP, HTTP(S) (apt updates, acme.sh / DuckDNS)
    iifname $DMZ oifname $WAN ip saddr $WEB01 ip daddr $VMW_DNS meta l4proto { tcp, udp } th dport 53 accept
    iifname $DMZ oifname $WAN ip saddr $WEB01 udp dport 123 accept
    iifname $DMZ oifname $WAN ip saddr $WEB01 tcp dport { 80, 443 } accept

    # Outside -> web01: published HTTPS (see DNAT below)
    iifname $WAN oifname $DMZ ip daddr $WEB01 tcp dport 443 ct status dnat accept

    # Admin zone -> web01: SSH (fw01 carries the IP restriction, not web01) and HTTPS
    iifname $ADMIN oifname $DMZ ip saddr $NET_ADMIN ip daddr $WEB01 tcp dport { 22, 443 } accept

    # --- Workstations -> ad01 ------------------------------------------------
    # What a domain member needs: 53 DNS, 88 Kerberos, 123 NTP (Kerberos allows 5 min skew),
    # 135 + 49152-65535 RPC (join, Netlogon), 389 LDAP, 445 SMB (SYSVOL: GPOs),
    # 464 Kerberos password change, 636 LDAPS, 3268-3269 global catalog
    iifname { $ADMIN, $USERS } oifname $SRV ip saddr { $NET_ADMIN, $NET_USERS } ip daddr $AD01 meta l4proto { tcp, udp } th dport { 53, 88, 389, 464 } accept
    iifname { $ADMIN, $USERS } oifname $SRV ip saddr { $NET_ADMIN, $NET_USERS } ip daddr $AD01 udp dport 123 accept
    iifname { $ADMIN, $USERS } oifname $SRV ip saddr { $NET_ADMIN, $NET_USERS } ip daddr $AD01 tcp dport { 135, 445, 636, 3268-3269, 49152-65535 } accept

    # Admin zone only -> ad01: RDP, WinRM (Enter-PSSession), AD Web Services (RSAT / AD PowerShell)
    iifname $ADMIN oifname $SRV ip saddr $NET_ADMIN ip daddr $AD01 tcp dport { 3389, 5985, 9389 } accept
    iifname { $ADMIN, $USERS } oifname $SRV ip daddr $AD01 icmp type echo-request limit rate 5/second accept

    # --- ad01 -> Internet ----------------------------------------------------
    # DNS forwarders, time, Windows Update. Nothing else leaves the Servers zone.
    iifname $SRV oifname $WAN ip saddr $AD01 meta l4proto { tcp, udp } th dport 53 accept
    iifname $SRV oifname $WAN ip saddr $AD01 udp dport 123 accept
    iifname $SRV oifname $WAN ip saddr $AD01 tcp dport { 80, 443 } accept

    # Not allowed on purpose: DMZ -> Servers (web01 never talks to the DC),
    # Users -> ad01 admin ports, Users -> Admin, Users -> DMZ, Users -> Internet.
    limit rate 10/minute log prefix "fw01-fwd-drop " level warn
  }

  # Traffic sent by fw01 (updates, DNS): left open
  chain output {
    type filter hook output priority filter; policy accept;
  }
}

table ip nat {
  # DNAT: HTTPS reaching the WAN IP is sent to web01
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    iifname $WAN ip daddr $WAN_IP tcp dport 443 dnat to $WEB01
  }
  # SNAT: everything leaving through the WAN takes fw01's IP
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname $WAN snat to $WAN_IP
  }
}
