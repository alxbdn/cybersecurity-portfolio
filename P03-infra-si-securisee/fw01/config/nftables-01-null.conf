#!/usr/sbin/nft -f
# =============================================================================
# fw01 - Step 1: routing + NAT only, no filtering
# Used while the lab is being built (web01, ad01, win01, win02).
# Replace with nftables-02-full.conf as soon as every machine is up.
# =============================================================================
flush ruleset

table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname "ens32" snat to 192.168.93.10   # everything leaving through the WAN takes fw01's IP
  }
}

# Log every new connection crossing fw01 (no filtering: policy accept).
# Once per connection, not per packet.
table inet journal {
  chain forward {
    type filter hook forward priority filter; policy accept;
    ct state new log prefix "fw01-fwd-new " level info
  }
}
